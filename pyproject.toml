[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundevo"
version = "0.3.0"
description = "Adaptive-boundary multi-parent evolutionary optimization in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZJY-HSBL" }]
dependencies = ["numpy>=1.24"]
keywords = ["genetic-algorithm", "evolutionary-computation", "optimization", "multi-parent-crossover"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
cec2017 = ["opfunu>=1.0.1,<2", "setuptools<81"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["boundevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
