name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: boundevo --version
      - run: ruff check .
      - run: pytest

  cec2017-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[cec2017]"
      - name: Run CEC2017 smoke experiment
        run: >-
          python scripts/run_cec2017.py
          --functions 1
          --methods abc
          --dimension 10
          --evaluations 500
          --repeats 1
          --output /tmp/cec2017_trials.csv
          --summary /tmp/cec2017_summary.csv
      - name: Verify result files
        run: |
          test -s /tmp/cec2017_trials.csv
          test -s /tmp/cec2017_summary.csv
      - name: Run parent-count sweep smoke experiment
        run: >-
          python scripts/run_parent_sweep.py
          --functions 1
          --parents 10-11
          --methods abc
          --dimension 10
          --evaluations 500
          --repeats 1
          --output /tmp/parent_sweep_trials.csv
          --summary /tmp/parent_sweep_summary.csv
          --tables /tmp/parent_sweep_tables.md
      - name: Verify sweep result files
        run: |
          test -s /tmp/parent_sweep_trials.csv
          test -s /tmp/parent_sweep_summary.csv
          test -s /tmp/parent_sweep_tables.md
      - name: Run coefficient-efficiency smoke experiment
        run: >-
          python scripts/reproduce_efficiency_figure.py
          --min-m 1
          --max-m 5
          --trials 10000
          --batch-size 2000
          --output /tmp/coefficient_efficiency.csv
      - name: Verify efficiency result file
        run: test -s /tmp/coefficient_efficiency.csv

  analysis-report-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[analysis]"
      - name: Create synthetic benchmark artifacts
        run: |
          cat > /tmp/summary.csv <<'CSV'
          function_id,dimension,method,mean_error,mean_elapsed_seconds,mean_evaluations
          1,10,re,3.0,0.30,3000
          1,10,edbf,2.0,0.20,2000
          1,10,abc,1.0,0.10,1000
          3,10,re,4.0,0.40,4000
          3,10,edbf,3.0,0.30,3000
          3,10,abc,2.0,0.20,2000
          4,10,re,5.0,0.50,5000
          4,10,edbf,4.0,0.40,4000
          4,10,abc,3.0,0.30,3000
          5,10,re,6.0,0.60,6000
          5,10,edbf,5.0,0.50,5000
          5,10,abc,4.0,0.40,4000
          CSV
          cat > /tmp/efficiency.csv <<'CSV'
          parent_count,method,trials,accepted,efficiency
          1,re,100,100,1.0
          1,edbf,100,100,1.0
          1,abc,100,100,1.0
          5,re,100,30,0.3
          5,edbf,100,70,0.7
          5,abc,100,100,1.0
          CSV
      - name: Run statistical analysis
        run: >-
          boundevo analyze
          --summary /tmp/summary.csv
          --metric mean_error
          --reference abc
          --methods re edbf abc
          --output /tmp/analysis.md
          --manifest /tmp/analysis_manifest.json
      - name: Build standalone report
        run: >-
          boundevo report
          --summary /tmp/summary.csv
          --efficiency /tmp/efficiency.csv
          --manifests /tmp/analysis_manifest.json
          --output /tmp/report.html
          --manifest /tmp/report_manifest.json
      - name: Verify research artifacts
        run: |
          test -s /tmp/analysis.md
          test -s /tmp/analysis_manifest.json
          test -s /tmp/report.html
          test -s /tmp/report_manifest.json
          grep -q "CEC2017 benchmark ranking" /tmp/report.html
          grep -q "Reproducibility manifests" /tmp/report.html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
