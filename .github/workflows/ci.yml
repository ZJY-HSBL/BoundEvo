name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: boundevo --version
      - run: ruff check .
      - run: pytest

  cec2017-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[cec2017]"
      - name: Run CEC2017 smoke experiment
        run: >-
          python scripts/run_cec2017.py
          --functions 1
          --methods abc
          --dimension 10
          --evaluations 500
          --repeats 1
          --output /tmp/cec2017_trials.csv
          --summary /tmp/cec2017_summary.csv
      - name: Verify result files
        run: |
          test -s /tmp/cec2017_trials.csv
          test -s /tmp/cec2017_summary.csv
      - name: Run parent-count sweep smoke experiment
        run: >-
          python scripts/run_parent_sweep.py
          --functions 1
          --parents 10-11
          --methods abc
          --dimension 10
          --evaluations 500
          --repeats 1
          --output /tmp/parent_sweep_trials.csv
          --summary /tmp/parent_sweep_summary.csv
          --tables /tmp/parent_sweep_tables.md
      - name: Verify sweep result files
        run: |
          test -s /tmp/parent_sweep_trials.csv
          test -s /tmp/parent_sweep_summary.csv
          test -s /tmp/parent_sweep_tables.md
      - name: Run coefficient-efficiency smoke experiment
        run: >-
          python scripts/reproduce_efficiency_figure.py
          --min-m 1
          --max-m 5
          --trials 10000
          --batch-size 2000
          --output /tmp/coefficient_efficiency.csv
      - name: Verify efficiency result file
        run: test -s /tmp/coefficient_efficiency.csv

  analysis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[analysis]"
      - name: Create synthetic benchmark summary
        run: |
          cat > /tmp/summary.csv <<'CSV'
          function_id,dimension,method,mean_error
          1,10,re,3.0
          1,10,edbf,2.0
          1,10,abc,1.0
          3,10,re,4.0
          3,10,edbf,3.0
          3,10,abc,2.0
          4,10,re,5.0
          4,10,edbf,4.0
          4,10,abc,3.0
          5,10,re,6.0
          5,10,edbf,5.0
          5,10,abc,4.0
          CSV
      - name: Run statistical analysis
        run: >-
          boundevo analyze
          --summary /tmp/summary.csv
          --metric mean_error
          --reference abc
          --methods re edbf abc
          --output /tmp/analysis.md
      - run: test -s /tmp/analysis.md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
