name: CEC2017 Coefficient Position Three-Arm Mechanism Study

on:
  push:
    paths:
      - ".github/workflows/coefficient-order-mechanism.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    name: F${{ matrix.fid }} · ABC / Shuffle / Reverse · 12 fresh seeds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fid: [10, 16, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed optimizer and C-derived reference backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "git+https://github.com/tilleyd/cec2017-py.git@424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
      - name: Execute 36 original runs with matched initial populations
        run: |
          python -u scripts/run_abc_reverse_mechanism.py \
            --function-id ${{ matrix.fid }} \
            --output-dir /tmp/rank/f${{ matrix.fid }}
      - name: Archive original experiment shards, including partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-rank-f${{ matrix.fid }}
          path: /tmp/rank/
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: Validate 144 actual runs, coefficient audit, plots and bilingual evidence
    needs: [experiment]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install statistical analysis and regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Recover every original function seed shard
        uses: actions/download-artifact@v4
        with:
          pattern: boundevo-rank-f*
          merge-multiple: true
          path: /tmp/rank
      - name: Independently reconcile source trials, compute eight paired Holm tests and chart coefficient distributions
        run: |
          python scripts/aggregate_abc_reverse_mechanism.py \
            --input-dir /tmp/rank \
            --output-dir docs/experiments/cec2017-abc-reverse-30d-10k-2026-10-20 \
            --figure-dir docs/figures
      - name: Update all earlier evidence sections and add new original-data research results
        run: |
          python scripts/update_readme_results.py
          python scripts/research_anytime_visuals.py
          python scripts/update_mechanism_readmes.py
          python scripts/update_readme_results.py --check
          python scripts/research_anytime_visuals.py --check
          python scripts/update_mechanism_readmes.py --check
      - name: Validate 144 real runs, 3312 checkpoint rows and diagnostic figures
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          folder = Path("docs/experiments/cec2017-abc-reverse-30d-10k-2026-10-20")
          def tab(filename):
              with (folder/filename).open(newline="") as f:
                  return list(csv.DictReader(f))
          env = json.loads((folder/"environment.json").read_text(encoding="utf-8"))
          assert env["trials"] == len(tab("trials.csv")) == 144
          assert env["history_rows"] == len(tab("history.csv")) == 3312
          assert env["repeats"] == 12 and env["evaluations"] == 10000
          assert len(env["source_manifests"]) == 4
          assert env["reference_commit"] == "424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
          assert len(tab("summary.csv")) == 12
          assert len(tab("paired_tests.csv")) == 8
          assert len(tab("paired_effects.csv")) == 96
          assert len(tab("coefficient_position_audit.csv")) == 15
          overview = json.loads((folder/"coefficient_audit.json").read_text(encoding="utf-8"))
          assert overview["total_draws"] == 50000
          for figure in ("cec2017-coefficient-rank-144-paired-effects.svg",
                         "cec2017-abc-50000-coefficient-position.svg"):
              svg = Path("docs/figures")/figure
              assert svg.stat().st_size > 6000, figure
              assert ElementTree.parse(svg).getroot().tag.endswith("svg")
              for name in ("README.md", "README_CN.md"):
                  assert figure in Path(name).read_text(encoding="utf-8")
          print("Validated 144 original optimizer runs and two generator/optimizer plots.")
          PY
          python -m pytest -q
          python -m ruff check .
      - name: Preserve completed mechanism study evidence
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-abc-rank-mechanism-144-verified
          path: |
            docs/experiments/cec2017-abc-reverse-30d-10k-2026-10-20/
            docs/figures/cec2017-coefficient-rank-144-paired-effects.svg
            docs/figures/cec2017-abc-50000-coefficient-position.svg
          retention-days: 90
      - name: Publish only complete scientifically validated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-abc-reverse-30d-10k-2026-10-20/
          git add docs/figures/ README.md README_CN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish 144 verified rank-coefficient trials and 50000-vector audit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
