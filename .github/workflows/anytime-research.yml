name: Publish measured anytime research and scientific charts
# Refresh bilingual README evidence after real 80-trial ABC-Shuffle release data.
# Run after data-only CSV line endings and import-style gates are fixed.

on:
  push:
    paths:
      - ".github/workflows/anytime-research.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testing requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Reanalyse all original 120 100k runs and regenerate figures
        run: |
          python scripts/research_anytime_visuals.py
          python scripts/research_anytime_visuals.py --check
      - name: Verify statistics, original data and all SVGs
        run: |
          python -m pytest -q tests/test_anytime_research.py
          python -m ruff check .
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path("docs/figures")
          names = (
              "cec2017-100k-anytime-ribbons.svg",
              "cec2017-100k-seed-scatter.svg",
              "cec2017-100k-target-attainment.svg",
              "cec2017-100k-anytime-contrasts.svg",
          )
          for name in names:
              file = root/name
              assert file.stat().st_size > 3000, name
              assert ElementTree.parse(file).getroot().tag.endswith("svg")
          print("Verified four research SVGs computed entirely from original data.")
          PY
      - name: Archive new scientific results
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-anytime-100k-trace-analysis
          path: |
            docs/experiments/cec2017-anytime-30d-100k-20seeds-2026-10-20/
            docs/figures/cec2017-100k-anytime-*.svg
            docs/figures/cec2017-100k-seed-scatter.svg
            docs/figures/cec2017-100k-target-attainment.svg
          retention-days: 90
      - name: Commit results only after every validation passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-anytime-30d-100k-20seeds-2026-10-20/
          git add docs/figures/ README.md README_CN.md
          git diff --cached --quiet && exit 0
          git commit -m "research: publish 100k anytime uncertainty and four original-data figures"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
