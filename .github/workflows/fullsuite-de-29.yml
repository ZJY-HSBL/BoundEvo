name: CEC2017 Full 29-Function ABC vs DE Replication

on:
  push:
    paths:
      - ".github/workflows/fullsuite-de-29.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    name: CEC29 shard ${{ matrix.shard }} · real ABC/Reverse/DE optimizer trials
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned C-derived CEC2017 backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "git+https://github.com/tilleyd/cec2017-py.git@424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
      - name: Execute original full-suite optimization trials
        run: |
          python -u scripts/run_fullsuite_de.py \
            --shard ${{ matrix.shard }} \
            --output-dir /tmp/cec-full/shard${{ matrix.shard }}
      - name: Archive each original function shard including partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-de-full-shard${{ matrix.shard }}
          path: /tmp/cec-full/
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Validate 435 original trials, inference, three SVGs and bilingual README
    runs-on: ubuntu-latest
    needs: [compute]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies for scientific inference and strict tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Retrieve all six original optimizer shards
        uses: actions/download-artifact@v4
        with:
          pattern: boundevo-de-full-shard*
          merge-multiple: true
          path: /tmp/cec-full
      - name: Verify 29 functions, 435 real records and 43500 states; calculate inference and SVGs
        run: |
          python scripts/aggregate_fullsuite_de.py \
            --input-dir /tmp/cec-full \
            --output-dir docs/experiments/cec2017-fullsuite-de-30d-10k-2026-10-21 \
            --figure-dir docs/figures
      - name: Regenerate verified English and Chinese measured-science summaries
        run: |
          python scripts/update_readme_results.py
          python scripts/research_anytime_visuals.py
          python scripts/update_mechanism_readmes.py
          python scripts/update_fullsuite_de_readmes.py
          python scripts/update_readme_results.py --check
          python scripts/research_anytime_visuals.py --check
          python scripts/update_mechanism_readmes.py --check
          python scripts/update_fullsuite_de_readmes.py --check
      - name: Reject incomplete source data, missing plots, scientific inconsistency
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          d = Path("docs/experiments/cec2017-fullsuite-de-30d-10k-2026-10-21")
          def csv_rows(filename):
              with (d / filename).open(newline="") as f:
                  return list(csv.DictReader(f))
          meta = json.loads((d/"environment.json").read_text())
          stat = json.loads((d/"global_statistics.json").read_text())
          assert meta["trials"] == len(csv_rows("trials.csv")) == 435
          assert meta["history_rows"] == len(csv_rows("history.csv")) == 43500
          assert len(csv_rows("summary.csv")) == 87
          assert len(csv_rows("function_ranks.csv")) == 87
          assert len(csv_rows("function_sign_tests.csv")) == 3
          assert len(meta["source_manifests"]) == 6
          assert stat["functions"] == 29 and stat["trials"] == 435
          assert stat["permutation_iterations"] == 20000
          assert meta["reference_commit"] == "424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
          assert len({(t["function_id"],t["repeat"],t["method"]) for t in
                      csv_rows("trials.csv")}) == 435
          pictures = ("cec2017-fullsuite-de-relative-heatmap.svg",
                      "cec2017-fullsuite-de-ranks.svg",
                      "cec2017-fullsuite-de-four-convergence.svg")
          for picture in pictures:
              svg = Path("docs/figures")/picture
              assert svg.stat().st_size > 6500, picture
              assert ElementTree.parse(svg).getroot().tag.endswith("svg")
              for name in ("README.md", "README_CN.md"):
                  assert picture in Path(name).read_text(encoding="utf-8")
          print("Full CEC2017 DE evidence: 435 genuine optimizer trials, 43500 states, all 29 tasks.")
          PY
          python -m pytest -q
          python -m ruff check .
      - name: Archive full original experimental evidence and all graphics
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-full-cec2017-435-original-trials-verified
          path: |
            docs/experiments/cec2017-fullsuite-de-30d-10k-2026-10-21/
            docs/figures/cec2017-fullsuite-de-*.svg
          retention-days: 90
      - name: Publish only proven original results and reproducible graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-fullsuite-de-30d-10k-2026-10-21/
          git add docs/figures/cec2017-fullsuite-de-*.svg README.md README_CN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish 435 real 29-function DE comparison trials and source-derived charts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
