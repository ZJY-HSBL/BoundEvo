name: CEC2017 Targeted 100k-FE Paper-Budget Study

on:
  push:
    paths:
      - ".github/workflows/paper-budget-100k.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiments:
    name: F${{ matrix.function_id }} 100k-FE continuation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        function_id: [16, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published exact-reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "git+https://github.com/tilleyd/cec2017-py.git@424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
      - name: Run 15 trials and compare every 10k prefix to the actual historical holdout
        run: |
          python -u scripts/run_paper_budget_case.py \
            --function-id ${{ matrix.function_id }} \
            --output-dir /tmp/paper-budget/f${{ matrix.function_id }}
      - name: Upload all completed and partial experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-paper-budget-f${{ matrix.function_id }}
          path: /tmp/paper-budget/
          retention-days: 90
          if-no-files-found: warn

  merge:
    name: Verify trajectories and publish matched-budget research
    needs: [experiments]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BoundEvo research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: boundevo-paper-budget-f*
          merge-multiple: true
          path: /tmp/paper-budget
      - name: Validate 100k-FE trial keys and exact 10k prefix continuity
        run: |
          python scripts/aggregate_paper_budget.py \
            --input-dir /tmp/paper-budget \
            --output-dir docs/experiments/cec2017-paperbudget-30d-100k-2026-10-18
      - name: Regenerate scientific plot, table and bilingual README
        run: |
          python scripts/update_readme_results.py
          python scripts/update_readme_results.py --check
      - name: Independently validate 30 runs and vector plot
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path("docs/experiments/cec2017-paperbudget-30d-100k-2026-10-18")
          with (root/"trials.csv").open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          with (root/"history.csv").open(newline="") as handle:
              history = list(csv.DictReader(handle))
          env = json.loads((root/"environment.json").read_text())
          assert len(rows) == 30 and env["trials"] == 30
          assert env["evaluations"] == 100000 and env["repeats"] == 5
          assert len(history) == env["history_rows"] and len(history) >= 90
          assert all(int(row["evaluations"]) == 100000 for row in rows)
          figure = "cec2017-f16-f22-100k-trajectories.svg"
          plot = Path("docs/figures") / figure
          assert plot.stat().st_size > 2500
          assert ElementTree.parse(plot).getroot().tag.endswith("svg")
          for name in ("README.md", "README_CN.md"):
              text = Path(name).read_text(encoding="utf-8")
              assert figure in text
              assert "cec2017-paperbudget-30d-100k-2026-10-18/trials.csv" in text
          print("Verified 30 actual paper-budget trials and paired 10k/100k checkpoints")
          PY
      - name: Archive validated experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-f16-f22-100k-complete-evidence
          path: docs/experiments/cec2017-paperbudget-30d-100k-2026-10-18/
          retention-days: 90
      - name: Commit data and generated README visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-paperbudget-30d-100k-2026-10-18/
          git add README.md README_CN.md docs/figures/
          git commit -m "data: publish verified F16 F22 100k-FE budget-continuation results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
