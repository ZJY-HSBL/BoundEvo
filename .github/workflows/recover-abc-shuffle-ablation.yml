name: Recover verified 80-run ABC-Shuffle ablation

on:
  push:
    paths:
      - ".github/workflows/recover-abc-shuffle-ablation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Recover original four function shards without rerunning optimizer
        uses: actions/download-artifact@v4
        with:
          run-id: 39362054293
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: boundevo-abc-shuffle-f*
          merge-multiple: true
          path: /tmp/ablation
      - name: Verify all originals, regenerate research, and gate tests
        run: |
          python scripts/aggregate_abc_shuffle_ablation.py \
            --input-dir /tmp/ablation \
            --output-dir docs/experiments/cec2017-abc-shuffle-30d-10k-2026-10-20 \
            --figure docs/figures/cec2017-abc-shuffle-paired-seeds.svg
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          folder = Path("docs/experiments/cec2017-abc-shuffle-30d-10k-2026-10-20")
          def rows(path):
              with (folder / path).open(newline="") as f:
                  return list(csv.DictReader(f))
          env = json.loads((folder / "environment.json").read_text())
          assert env["trials"] == len(rows("trials.csv")) == 80
          assert env["history_rows"] == len(rows("history.csv")) == 1840
          assert env["base_seed"] == 20261121 and len(env["source_manifests"]) == 4
          assert len(rows("summary.csv")) == 8 and len(rows("paired_tests.csv")) == 4
          plot = Path("docs/figures/cec2017-abc-shuffle-paired-seeds.svg")
          assert plot.stat().st_size > 4500
          assert ElementTree.parse(plot).getroot().tag.endswith("svg")
          print("Verified original 80 optimizer trials; no optimizer was rerun.")
          PY
      - name: Preserve verified research package
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-recovered-abc-shuffle-80-runs-verified
          path: |
            docs/experiments/cec2017-abc-shuffle-30d-10k-2026-10-20/
            docs/figures/cec2017-abc-shuffle-paired-seeds.svg
          retention-days: 90
      - name: Commit only validated original data, chart and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-abc-shuffle-30d-10k-2026-10-20/
          git add docs/figures/cec2017-abc-shuffle-paired-seeds.svg
          git diff --cached --quiet && exit 0
          git commit -m "research: publish recovered 80-run coefficient-rank ablation originals"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
