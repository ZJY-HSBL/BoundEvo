name: CEC2017 Fresh-Seed Holdout Validation

on:
  push:
    paths:
      - ".github/workflows/holdout-seeds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trials:
    name: F${{ matrix.function_id }} fresh seeds
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        function_id: [16, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent reference backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "git+https://github.com/tilleyd/cec2017-py.git@424a9fa2757914c3e4cfdd8f59a268b1aeb3197f"
      - name: Execute 20 never-before-used seeds on F16 or F22
        run: |
          python -u scripts/validate_reference_cec2017.py \
            --functions ${{ matrix.function_id }} \
            --dimension 30 \
            --dimensions-preflight 10 30 \
            --methods abc edbf re \
            --repeats 20 \
            --evaluations 10000 \
            --seed 20261037 \
            --output-dir /tmp/seed-holdout/f${{ matrix.function_id }}
      - name: Upload independent raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-holdout-f${{ matrix.function_id }}
          path: /tmp/seed-holdout/
          retention-days: 90
          if-no-files-found: warn

  analysis:
    name: Validate raw data and publish statistically adjusted holdout
    runs-on: ubuntu-latest
    needs: [trials]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: boundevo-holdout-f*
          merge-multiple: true
          path: /tmp/seed-holdout/
      - name: Validate seeds, calculate bootstrap CI and exact sign tests
        # The merger and README visualization are versioned with this workflow.
        run: |
          python scripts/aggregate_seed_holdout.py \
            --input-dir /tmp/seed-holdout \
            --output-dir docs/experiments/cec2017-holdout-30d-10k-2026-10-17
      - name: Regenerate actual README tables and scientific SVGs
        run: |
          python scripts/update_readme_results.py
          python scripts/update_readme_results.py --check
      - name: Verify integrity of evidence and figure references
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          root=Path("docs/experiments/cec2017-holdout-30d-10k-2026-10-17")
          with (root/"trials.csv").open(newline="") as handle:
              trials=list(csv.DictReader(handle))
          env=json.loads((root/"environment.json").read_text())
          assert len(trials)==120 and env["trials"]==120
          assert env["seed_base"]==20261037 and env["repeats"]==20
          assert env["evaluations"]==10000
          for filename in ("cec2017-f16-f22-holdout-mean-errors.svg",):
              img=Path("docs/figures")/filename
              assert img.stat().st_size>1000
              assert ElementTree.parse(img).getroot().tag.endswith("svg")
              for name in ("README.md","README_CN.md"):
                  readme=Path(name).read_text(encoding="utf-8")
                  assert filename in readme
                  assert "cec2017-holdout-30d-10k-2026-10-17/trials.csv" in readme
          PY
      - name: Archive real completed trials
        uses: actions/upload-artifact@v4
        with:
          name: boundevo-f16-f22-20newseeds-actual-results
          path: docs/experiments/cec2017-holdout-30d-10k-2026-10-17/
          retention-days: 90
      - name: Commit verified results and both README figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/cec2017-holdout-30d-10k-2026-10-17/
          git add README.md README_CN.md docs/figures/
          git commit -m "data: publish 120 independent holdout trials for F16 and F22"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
